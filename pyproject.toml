[project]
authors = [{name = "JuanCoy", email = "jcoy93@uan.edu.co"}]
dependencies = []
name = "Organoides_DL"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]



[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
typecheck = "mypy src/organoides_DL"
medir = { cmd = "python scripts/medir_area.py", env = { PYTHONPATH = "src" } }
histograma = { cmd = "python scripts/graficar_histograma.py", env = { PYTHONPATH = "src" } }
preparar_safo = "python scripts/divisionart_safranina.py"
verificar = { cmd = "python scripts/area_augmentation.py", env = { PYTHONPATH = "src" } }
entrenar = { cmd = "python scripts/entrenar.py", env = { PYTHONPATH = "src" } }
metricas = "python scripts/metricas_safranina.py"
recortar_sim = "python scripts/recortar_simtk.py"
huellas = { cmd = "python scripts/huellas_densnet121.py", env = {PYTHONPATH = "src"}}
medir_col = { cmd = "python scripts/medir_colageno.py", env = { PYTHONPATH = "src" } }
preparar_colII ="python scripts/divisionart_colII.py"
entrenar_colII  ="python scripts/entrenar_colII.py"
metricas_colII ="python scripts/metricas_colII.py"
evaluar = { cmd = "python scripts/evaluar_organoide.py", env = { PYTHONPATH = "src" } }
entrenar_final = { cmd = "python scripts/entrenar_final.py", env = { PYTHONPATH = "src" } }


[tool.pixi.dependencies]
numpy = ">=2.5.3,<3"
pytest = ">=9.1.1,<10"
ruff = ">=0.16.7,<0.17"
mypy = ">=2.3.1,<3"
pandas = ">=3.0.6,<4"
openpyxl = ">=3.1.5,<4"
pillow = ">=12.3.0,<13"
matplotlib = ">=3.11.2,<4"
scikit-learn = ">=1.9.1,<2"
tensorflow = ">=2.21.0,<3"
scikit-image = ">=0.26.0,<0.27"

[tool.pixi.pypi-dependencies]
Organoides_DL = { path = ".", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]

