[project]
authors = [{name = "JuanCoy", email = "jcoy93@uan.edu.co"}]
dependencies = []
name = "Organoides_DL"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]



[tool.pixi.tasks]
test = "pytest"
lint = "ruff check ."
fmt = "ruff format ."
typecheck = "mypy src/Organoides_DL"

[tool.pixi.dependencies]
numpy = ">=2.5.3,<3"
pytest = ">=9.1.1,<10"
ruff = ">=0.16.7,<0.17"
mypy = ">=2.3.1,<3"
pandas = ">=3.0.6,<4"
openpyxl = ">=3.1.5,<4"
pillow = ">=12.3.0,<13"

[tool.pixi.pypi-dependencies]
Organoides_DL = { path = ".", editable = true }
